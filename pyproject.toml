[project]
name = "nvnm-cite"
version = "0.1.0"
description = "Citation existence verification and filing receipts on NVNM Chain"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nvnm_cite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "nvnm-cite"
version = "0.1.0"
description = "Citation existence verification and filing receipts on NVNM Chain"
requires-python = ">=3.11"
dependencies = [
    "courts-db>=0.10.27",
    "eyecite>=2.7.6",
    "pdfplumber>=0.11.9",
    "reporters-db>=3.2.65",
]

[project.scripts]
nvnm-cite = "nvnm_cite.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nvnm_cite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
